name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: DSP tests + typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite (tests + build)
        run: npm run check
